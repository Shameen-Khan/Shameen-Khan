<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">Build. Learn. Experiment. Repeat. — beyond the horizon</title>
<desc id="desc">One problem. One project. One improvement at a time. A small spacecraft travels above the glowing horizon of a distant planet.</desc>
<defs>
<linearGradient id="space" x2="1" y2="1"><stop stop-color="#050710"/><stop offset=".52" stop-color="#100f22"/><stop offset="1" stop-color="#080c19"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf6"/><stop offset=".48" stop-color="#ebe8ff"/><stop offset="1" stop-color="#a3aed3"/></linearGradient>
<linearGradient id="spectrum" x2="1" y2=".6"><stop stop-color="#c0c9ff"/><stop offset=".42" stop-color="#c099ff"/><stop offset=".76" stop-color="#ecbaff"/><stop offset="1" stop-color="#ffd5ad"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#6d709c" stop-opacity=".25"/><stop offset=".48" stop-color="#d2b9ff" stop-opacity=".7"/><stop offset="1" stop-color="#76baca" stop-opacity=".2"/></linearGradient>
<linearGradient id="tail"><stop stop-color="#d6bdff" stop-opacity="0"/><stop offset="1" stop-color="#f0e5ff"/></linearGradient>
<radialGradient id="violet"><stop stop-color="#9864eb" stop-opacity=".6"/><stop offset=".45" stop-color="#663e9c" stop-opacity=".24"/><stop offset="1" stop-color="#663e9c" stop-opacity="0"/></radialGradient>
<radialGradient id="cyan"><stop stop-color="#4da9c5" stop-opacity=".32"/><stop offset="1" stop-color="#225479" stop-opacity="0"/></radialGradient>
<radialGradient id="amber"><stop stop-color="#fac0a4" stop-opacity=".55"/><stop offset="1" stop-color="#cf839d" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop stop-color="#fffef1"/><stop offset=".1" stop-color="#f4d3ff" stop-opacity=".95"/><stop offset=".36" stop-color="#b79bff" stop-opacity=".45"/><stop offset="1" stop-color="#b79bff" stop-opacity="0"/></radialGradient>
<radialGradient id="planet" cx=".23" cy=".13" r=".88"><stop stop-color="#a8a5d6"/><stop offset=".25" stop-color="#5e5489"/><stop offset=".62" stop-color="#22263e"/><stop offset="1" stop-color="#040810"/></radialGradient>
<radialGradient id="eclipse" cx=".27" cy=".16" r=".9"><stop stop-color="#323148"/><stop offset=".45" stop-color="#141726"/><stop offset="1" stop-color="#050711"/></radialGradient>
<filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="208" rx="26"/></clipPath>

<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:1.8px}
.spin{transform-origin:0px 0px;animation:spin 64s linear infinite}
.counter{animation-direction:reverse;animation-duration:86s}
.float{animation:float 8s ease-in-out infinite}
.nebula{animation:drift 22s ease-in-out infinite alternate}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.twinkle{animation:twinkle 5s ease-in-out infinite alternate}
.signal{animation:signal 14s linear infinite}
.trace{animation:trace 12s linear infinite}
.shooting{opacity:0;animation:shoot 11s ease-in-out infinite}
.cursor{animation:cursor 1.5s steps(2,end) infinite}
.arrive{animation:arrive 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes drift{to{transform:translate(24px,-14px)}}
@keyframes breathe{from{opacity:.55}to{opacity:.95}}
@keyframes twinkle{from{opacity:.25}to{opacity:.85}}
@keyframes signal{to{stroke-dashoffset:-360}}
@keyframes trace{to{stroke-dashoffset:-1600}}
@keyframes shoot{0%,68%,100%{opacity:0;transform:translate(0,0)}70%{opacity:.9}82%{opacity:0;transform:translate(-380px,150px)}}
@keyframes cursor{50%{opacity:0}}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.shooting{display:none}}
</style>
</defs>
<g clip-path="url(#frame)"><rect width="1200" height="210" fill="url(#space)"/>

