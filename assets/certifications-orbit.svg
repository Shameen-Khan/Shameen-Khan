<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05010A"/><stop offset="50%" stop-color="#19052E"/><stop offset="100%" stop-color="#07010D"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0%" stop-color="#F3E8FF" stop-opacity=".98"/><stop offset="16%" stop-color="#D8B4FE" stop-opacity=".9"/><stop offset="48%" stop-color="#A855F7" stop-opacity=".28"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#fff;letter-spacing:5px}.s{font:400 15px Arial,sans-serif;fill:#D8B4FE}.m{font:700 11px monospace;fill:#C084FC;letter-spacing:2px}.t{font:700 14px Arial,sans-serif;fill:#fff}.d{font:400 11px Arial,sans-serif;fill:#CDB5E9}.link{font:700 11px Arial,sans-serif;fill:#E9D5FF;letter-spacing:1px}
  </style>
</defs>
<rect width="1200" height="500" rx="30" fill="url(#bg)"/>
<circle cx="600" cy="245" r="280" fill="url(#core)" filter="url(#blur)" opacity=".72"/>
<ellipse cx="600" cy="245" rx="355" ry="112" fill="none" stroke="#7E22CE" stroke-opacity=".26" stroke-width="1.5"/>
<ellipse cx="600" cy="245" rx="285" ry="75" fill="none" stroke="#A855F7" stroke-opacity=".34" stroke-width="1"/>
<text x="600" y="62" text-anchor="middle" class="h">CERTIFICATIONS</text>
<text x="600" y="90" text-anchor="middle" class="s">Click a credential to open its original certificate</text>

<g filter="url(#glow)">
  <circle cx="600" cy="245" r="58" fill="url(#core)"/>
  <circle cx="600" cy="245" r="17" fill="#F3E8FF" opacity=".9">
    <animate attributeName="r" values="13;21;13" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;.98;.55" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Credential 01 -->
<a href="https://drive.google.com/file/d/1RQvqpIVC_A5FVgtq1FLE6JxcSowUzONs/view?usp=drive_link" target="_blank">
  <g transform="translate(90 140)" filter="url(#glow)">
    <rect width="285" height="120" rx="18" fill="#10061B" stroke="#7E22CE" stroke-opacity=".72"/>
    <circle cx="31" cy="31" r="15" fill="#A855F7" opacity=".16"/>
    <path d="M31 19l4 9 10 1-7 6.5 2 10-9-5-9 5 2-10-7-6.5 10-1z" fill="#C084FC"/>
    <text x="58" y="30" class="m">CREDENTIAL 01</text>
    <text x="20" y="60" class="t">Certificate 01</text>
    <text x="20" y="80" class="d">Verified Drive credential</text>
    <text x="20" y="101" class="link">↗ OPEN CERTIFICATE</text>
  </g>
</a>

