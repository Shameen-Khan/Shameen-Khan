<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Shameen Khan — mission control</title>
<desc id="desc">Developer profile: AI/ML, DSA and Full-Stack. Languages: Python, Java, C and SQL. A slowly rotating orbital display accompanies the terminal.</desc>
<defs>
<linearGradient id="space" x2="1" y2="1"><stop stop-color="#030711"/><stop offset=".53" stop-color="#100d29"/><stop offset="1" stop-color="#040918"/></linearGradient>
<radialGradient id="violet"><stop stop-color="#8b4af4" stop-opacity=".45"/><stop offset=".5" stop-color="#50288d" stop-opacity=".18"/><stop offset="1" stop-color="#50288d" stop-opacity="0"/></radialGradient>
<radialGradient id="blue"><stop stop-color="#35bff5" stop-opacity=".28"/><stop offset="1" stop-color="#1673bf" stop-opacity="0"/></radialGradient>
<radialGradient id="heart"><stop stop-color="#fffde6"/><stop offset=".12" stop-color="#ffe4cf" stop-opacity=".95"/><stop offset=".3" stop-color="#d8a2ff" stop-opacity=".7"/><stop offset="1" stop-color="#9b68fd" stop-opacity="0"/></radialGradient>
<radialGradient id="planet" cx=".3" cy=".23" r=".8"><stop stop-color="#cfb9f5"/><stop offset=".2" stop-color="#7369b4"/><stop offset=".53" stop-color="#343368"/><stop offset=".8" stop-color="#101529"/><stop offset="1" stop-color="#040810"/></radialGradient>
<linearGradient id="ring"><stop stop-color="#576da5" stop-opacity=".2"/><stop offset=".45" stop-color="#e2b9ff"/><stop offset=".68" stop-color="#99d9f8"/><stop offset="1" stop-color="#68578b" stop-opacity=".2"/></linearGradient>
<linearGradient id="trail"><stop stop-color="#b1e9ff" stop-opacity="0"/><stop offset="1" stop-color="#e5f8ff"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#9d79ea" stop-opacity=".1"/><stop offset=".45" stop-color="#b4a0ff" stop-opacity=".65"/><stop offset="1" stop-color="#5de0e6" stop-opacity=".15"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:2px}
.turn{animation:spin 70s linear infinite;transform-origin:0px 0px}
.reverse{animation-direction:reverse;animation-duration:95s}
.float{animation:float 9s ease-in-out infinite}
.drift{animation:drift 24s ease-in-out infinite alternate}
.twinkle{animation:twinkle 5s ease-in-out infinite alternate}
.pulse{animation:pulse 7s ease-in-out infinite}
.flow{animation:flow 18s linear infinite}
.meteor{opacity:0;animation:meteor 13s ease-in-out infinite}
.cursor{animation:cursor 1.4s steps(2,end) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes drift{to{transform:translate(28px,-16px)}}
@keyframes twinkle{from{opacity:.2}to{opacity:.85}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes meteor{0%,72%,100%{opacity:0;transform:translate(0,0)}74%{opacity:.85}84%{opacity:0;transform:translate(-290px,150px)}}
@keyframes cursor{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.meteor{display:none}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="360" fill="url(#space)"/>

