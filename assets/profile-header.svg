</defs>
<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<circle cx="180" cy="80" r="180" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="180;260;180" dur="7s" repeatCount="indefinite"/></circle>
