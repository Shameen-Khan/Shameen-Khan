<radialGradient id="cyan"><stop stop-color="#4da9c5" stop-opacity=".32"/><stop offset="1" stop-color="#225479" stop-opacity="0"/></radialGradient>
<radialGradient id="amber"><stop stop-color="#fac0a4" stop-opacity=".55"/><stop offset="1" stop-color="#cf839d" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop stop-color="#fffef1"/><stop offset=".1" stop-color="#f4d3ff" stop-opacity=".95"/><stop offset=".36" stop-color="#b79bff" stop-opacity=".45"/><stop offset="1" stop-color="#b79bff" stop-opacity="0"/></radialGradient>
