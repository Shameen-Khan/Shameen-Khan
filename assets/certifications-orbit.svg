    <animate attributeName="r" values="14;20;14" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;.95;.65" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</g>

<g>
  <g transform="translate(210 165)">
    <rect width="245" height="118" rx="16" fill="#10061B" stroke="#7E22CE" stroke-opacity=".6"/>
    <circle cx="35" cy="34" r="17" fill="#A855F7" opacity=".15"/>
    <path d="M35 23l5 10 11 1-8 7 3 11-11-6-11 6 3-11-8-7 11-1z" fill="#C084FC"/>
    <text x="66" y="32" class="m">LEARNING 01</text>
    <text x="22" y="66" class="t">Certificate Showcase</text>
    <text x="22" y="88" class="d">Add verified credential here</text>
    <text x="22" y="106" class="d">Issuer • Year • Skill</text>
  </g>

  <g transform="translate(745 165)">
    <rect width="245" height="118" rx="16" fill="#10061B" stroke="#7E22CE" stroke-opacity=".6"/>
    <circle cx="35" cy="34" r="17" fill="#A855F7" opacity=".15"/>
    <path d="M35 19l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#E9D5FF"/>
    <text x="66" y="32" class="m">LEARNING 02</text>
    <text x="22" y="66" class="t">Verified Credential</text>
    <text x="22" y="88" class="d">Add verified credential here</text>
    <text x="22" y="106" class="d">Issuer • Year • Skill</text>
  </g>
</g>

<g fill="#C084FC">
  <circle cx="160" cy="115" r="3"><animate attributeName="cy" values="115;95;115" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1035" cy="125" r="2.5"><animate attributeName="cx" values="1035;1065;1035" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="340" r="2"><animate attributeName="cx" values="270;320;270" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="335" r="2"><animate attributeName="cy" values="335;310;335" dur="3.7s" repeatCount="indefinite"/></circle>
</g>

<g>
  <circle cx="600" cy="210" r="132" fill="none" stroke="#A855F7" stroke-opacity=".35" stroke-dasharray="5 12">
    <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="210" r="155" fill="none" stroke="#C084FC" stroke-opacity=".22" stroke-dasharray="2 18">
    <animateTransform attributeName="transform" type="rotate" from="360 600 210" to="0 600 210" dur="24s" repeatCount="indefinite"/>
  </circle>
</g>

<text x="600" y="365" text-anchor="middle" class="m">VERIFIED SKILLS • CONTINUOUS LEARNING • BUILDING IN PUBLIC</text>
