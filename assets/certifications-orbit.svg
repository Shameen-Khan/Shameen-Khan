    <circle cx="30" cy="30" r="14" fill="#A855F7" opacity=".16"/>
    <path d="M30 18l4 8 9 1-6.5 6.5 2 9-8.5-4.7-8.5 4.7 2-9-6.5-6.5 9-1z" fill="#C084FC"/>
