"81.3" r="1.03" opacity="0.71"/><circle cx="726.5" cy="193.4" r="0.55" opacity="0.58"/><circle cx="1145.8" cy="11.0" r="0.99" opacity="0.51"/><circle cx="271.7" cy="163.1" r="1.19" opacity="0.78"/><circle cx="1116.1" cy="155.4" r="1.19" opacity="0.64"/><circle cx="959.2" cy="159.4" r="1.29" opacity="0.62"/><circle cx="72.9" cy="96.9" r="0.82" opacity="0.25"/><circle cx="872.5" cy="125.5" r="1.32" opacity="0.24"/><circle cx="144.2" cy="7.9" r="0.88" opacity="0.24"/><circle cx="321.2" cy="178.7" r="1.02" opacity="0.55"/><circle cx="937.8" cy="16.9" r="0.69" opacity="0.43"/><circle cx="586.6" cy="64.7" r="1.04" opacity="0.32"/><circle cx="855.2" cy="51.2" r="1.34" opacity="0.23"/></g>
<text x="40" y="37" font-size="11" fill="#b8a5df" class="mono">THE LEARNING CONSTELLATION</text>
<path d="M100 110L300 140 500 99 700 135 900 97 1100 122" fill="none" stroke="#8c99ce" stroke-opacity=".4"/>
<path class="flow" d="M100 110L300 140 500 99 700 135 900 97 1100 122" fill="none" stroke="#bcb5fa" stroke-dasharray="3 45" stroke-opacity=".7"/>
<g transform="translate(100 110)"><g class="float" style="animation-delay:-0s"><circle r="27" fill="url(#heart)" opacity=".45"/><circle r="4" fill="#ddd5ff"/><circle r="14" fill="none" stroke="#b3afff" stroke-opacity=".4"/><text y="42" text-anchor="middle" font-size="15" fill="#d5dcf1">Python</text></g></g><g transform="translate(300 140)"><g class="float" style="animation-delay:-1.6s"><circle r="27" fill="url(#heart)" opacity=".45"/><circle r="4" fill="#ddd5ff"/><circle r="14" fill="none" stroke="#b3afff" stroke-opacity=".4"/><text y="42" text-anchor="middle" font-size="15" fill="#d5dcf1">Java</text></g></g><g transform="translate(500 99)"><g class="float" style="animation-delay:-3.2s"><circle r="27" fill="url(#heart)" opacity=".45"/><circle r="4" fill="#ddd5ff"/><circle r="14" fill="none" stroke="#b3afff" stroke-opacity=".4"/><text y="42" text-anchor="middle" font-size="15" fill="#d5dcf1">C</text></g></g><g transform="translate(700 135)"><g class="float" style="animation-delay:-4.800000000000001s"><circle r="27" fill="url(#heart)" opacity=".45"/><circle r="4" fill="#ddd5ff"/><circle r="14" fill="none" stroke="#b3afff" stroke-opacity=".4"/><text y="42" text-anchor="middle" font-size="15" fill="#d5dcf1">AI / ML</text></g></g><g transform="translate(900 97)"><g class="float" style="animation-delay:-6.4s"><circle r="27" fill="url(#heart)" opacity=".45"/><circle r="4" fill="#ddd5ff"/><circle r="14" fill="none" stroke="#b3afff" stroke-opacity=".4"/><text y="42" text-anchor="middle" font-size="15" fill="#d5dcf1">Full-Stack</text></g></g><g transform="translate(1100 122)"><g class="float" style="animation-delay:-8s"><circle r="27" fill="url(#heart)" opacity=".45"/><circle r="4" fill="#ddd5ff"/><circle r="14" fill="none" stroke="#b3afff" stroke-opacity=".4"/><text y="42" text-anchor="middle" font-size="15" fill="#d5dcf1">DSA</text></g></g>

</g>
<rect x="1" y="1" width="1198" height="208" rx="24" fill="none" stroke="url(#edge)"/>
</svg>
