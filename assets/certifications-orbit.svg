<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06010B"/><stop offset="48%" stop-color="#19052E"/><stop offset="100%" stop-color="#08010F"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0%" stop-color="#F3E8FF" stop-opacity=".98"/><stop offset="17%" stop-color="#D8B4FE" stop-opacity=".9"/><stop offset="48%" stop-color="#A855F7" stop-opacity=".3"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#fff;letter-spacing:5px}.s{font:400 15px Arial,sans-serif;fill:#D8B4FE}.m{font:700 11px monospace;fill:#C084FC;letter-spacing:2px}.t{font:600 14px Arial,sans-serif;fill:#fff}.d{font:400 11px Arial,sans-serif;fill:#CDB5E9}
  </style>
</defs>
<rect width="1200" height="460" rx="30" fill="url(#bg)"/>
<circle cx="600" cy="230" r="250" fill="url(#core)" filter="url(#blur)" opacity=".72"/>
<ellipse cx="600" cy="230" rx="355" ry="108" fill="none" stroke="#7E22CE" stroke-opacity=".26" stroke-width="1.5"/>
<ellipse cx="600" cy="230" rx="285" ry="74" fill="none" stroke="#A855F7" stroke-opacity=".34" stroke-width="1"/>
<text x="600" y="62" text-anchor="middle" class="h">CERTIFICATIONS</text>
<text x="600" y="90" text-anchor="middle" class="s">A visual archive of credentials, learning and proof</text>

<g filter="url(#glow)">
