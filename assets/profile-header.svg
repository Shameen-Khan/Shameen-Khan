  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a855f7" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="330" rx="28" fill="url(#bg)"/>
