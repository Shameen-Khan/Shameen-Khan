  </g>
</a>

<g>
  <circle cx="600" cy="245" r="128" fill="none" stroke="#A855F7" stroke-opacity=".34" stroke-dasharray="5 12">
    <animateTransform attributeName="transform" type="rotate" from="0 600 245" to="360 600 245" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="245" r="154" fill="none" stroke="#C084FC" stroke-opacity=".22" stroke-dasharray="2 18">
    <animateTransform attributeName="transform" type="rotate" from="360 600 245" to="0 600 245" dur="23s" repeatCount="indefinite"/>
  </circle>
</g>

<g fill="#C084FC">
  <circle cx="65" cy="105" r="3"><animate attributeName="cy" values="105;85;105" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1135" cy="115" r="2.5"><animate attributeName="cx" values="1135;1165;1135" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="65" cy="425" r="2"><animate attributeName="cx" values="65;105;65" dur="4.7s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="430" r="2"><animate attributeName="cy" values="430;406;430" dur="3.8s" repeatCount="indefinite"/></circle>
</g>

<text x="600" y="468" text-anchor="middle" class="m">LEARNING • CREDENTIALS • CONTINUOUS GROWTH</text>
</svg>
