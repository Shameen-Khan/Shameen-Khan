<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07020F"/><stop offset="50%" stop-color="#19052E"/><stop offset="100%" stop-color="#06010B"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0%" stop-color="#E9D5FF" stop-opacity=".95"/><stop offset="18%" stop-color="#C084FC" stop-opacity=".8"/><stop offset="55%" stop-color="#A855F7" stop-opacity=".22"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#fff;letter-spacing:4px}.s{font:400 16px Arial,sans-serif;fill:#D8B4FE}.m{font:700 12px monospace;fill:#C084FC;letter-spacing:2px}.t{font:600 14px Arial,sans-serif;fill:#fff}.d{font:400 12px Arial,sans-serif;fill:#CDB5E9}
  </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<circle cx="600" cy="210" r="230" fill="url(#core)" filter="url(#blur)" opacity=".7"/>
<ellipse cx="600" cy="210" rx="330" ry="95" fill="none" stroke="#7E22CE" stroke-opacity=".24" stroke-width="1.5"/>
<ellipse cx="600" cy="210" rx="260" ry="62" fill="none" stroke="#A855F7" stroke-opacity=".32" stroke-width="1"/>
<path d="M140 310 C300 250 410 340 600 280 S900 220 1060 275" fill="none" stroke="#C084FC" stroke-opacity=".18"/>
<text x="600" y="70" text-anchor="middle" class="h">CERTIFICATIONS</text>
<text x="600" y="98" text-anchor="middle" class="s">A growing record of learning, skill and proof</text>

<g filter="url(#glow)">
