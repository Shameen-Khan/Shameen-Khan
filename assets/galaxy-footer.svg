<text x="600" y="44" text-anchor="middle" class="mono" font-size="10" fill="#bba6d2">BEYOND THE HORIZON</text>
<text x="600" y="91" text-anchor="middle" font-size="33" font-weight="700" letter-spacing="-.6" fill="url(#metal)">Build. Learn. Experiment. Repeat.</text>
