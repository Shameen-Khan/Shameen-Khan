  <g transform="translate(755 300)" filter="url(#glow)">
    <rect width="285" height="120" rx="18" fill="#10061B" stroke="#7E22CE" stroke-opacity=".72"/>
    <circle cx="31" cy="31" r="15" fill="#A855F7" opacity=".16"/>
    <path d="M31 18l4 9 10 1-7 6.5 2 10-9-5-9 5 2-10-7-6.5 10-1z" fill="#E9D5FF"/>
    <text x="58" y="30" class="m">CREDENTIAL 04</text>
    <text x="20" y="60" class="t">Certificate 04</text>
    <text x="20" y="80" class="d">Verified Drive credential</text>
