name: Generate Purple Contribution Snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate purple snake
        uses: Platane/snk@v3
        with:
          github_user_name: Shameen-Khan
          outputs: |
            dist/github-snake.svg?color_snake=%23A855F7&color_dots=%2318082B,%233B0764,%237E22CE,%23A855F7,%23E9D5FF
            dist/github-snake-dark.svg?color_snake=%23C084FC&color_dots=%2318082B,%233B0764,%237E22CE,%23A855F7,%23E9D5FF

      - name: Publish SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
