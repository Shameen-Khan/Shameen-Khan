<style>
text{font-family:Arial,Helvetica,sans-serif}
.mono{font-family:'Courier New',monospace;letter-spacing:1.8px}
.spin{transform-origin:0px 0px;animation:spin 64s linear infinite}
.counter{animation-direction:reverse;animation-duration:86s}
.float{animation:float 8s ease-in-out infinite}
.nebula{animation:drift 22s ease-in-out infinite alternate}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.twinkle{animation:twinkle 5s ease-in-out infinite alternate}
.signal{animation:signal 14s linear infinite}
.trace{animation:trace 12s linear infinite}
.shooting{opacity:0;animation:shoot 11s ease-in-out infinite}
.cursor{animation:cursor 1.5s steps(2,end) infinite}
.arrive{animation:arrive 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes drift{to{transform:translate(24px,-14px)}}
@keyframes breathe{from{opacity:.55}to{opacity:.95}}
@keyframes twinkle{from{opacity:.25}to{opacity:.85}}
@keyframes signal{to{stroke-dashoffset:-360}}
@keyframes trace{to{stroke-dashoffset:-1600}}
@keyframes shoot{0%,68%,100%{opacity:0;transform:translate(0,0)}70%{opacity:.9}82%{opacity:0;transform:translate(-380px,150px)}}
@keyframes cursor{50%{opacity:0}}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.shooting{display:none}}
</style>
</defs>
