<ellipse cx="600" cy="289" rx="610" ry="175" fill="url(#blue)" class="pulse"/>
<ellipse cx="600" cy="326" rx="675" ry="195" fill="#050a18" stroke="#919dda" stroke-opacity=".5"/>
<path d="M65 169Q600 43 1135 169" fill="none" stroke="#ae93ec" stroke-opacity=".3" filter="url(#glow)"/>
<text x="600" y="73" text-anchor="middle" font-size="30" fill="#f0edff" font-weight="700">Build. Learn. Experiment. Repeat.</text>
<text x="600" y="108" text-anchor="middle" font-size="15" fill="#adb9d5">One problem. One project. One improvement at a time.</text>
<g transform="translate(90 59)" fill="none" stroke="#e1e9ff" stroke-linecap="round" class="pulse"><path d="M-6 0H6M0-6V6" opacity=".8"/><circle r="1.4" fill="#fff" stroke="none"/></g><g transform="translate(1116 83)" fill="none" stroke="#e1e9ff" stroke-linecap="round" class="pulse"><path d="M-6 0H6M0-6V6" opacity=".8"/><circle r="1.4" fill="#fff" stroke="none"/></g>

</g>
<rect x="1" y="1" width="1198" height="178" rx="24" fill="none" stroke="url(#edge)"/>
</svg>
